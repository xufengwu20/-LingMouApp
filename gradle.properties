org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# 给所有仓库请求加超时上限：某个仓库不可达时快速失败，
# 而不是让整个构建卡在重试里（plugins.gradle.org 在本机就不可达）。
systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=30000

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
# SDK 组件已经预装完毕，禁止 AGP 再去下载（受限环境下 SDK 目录不可写）
android.builder.sdkDownload=false

kotlin.code.style=official
